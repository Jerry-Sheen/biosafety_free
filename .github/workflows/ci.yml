name: RAG Vibe CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # 1. Linting & Code Style Check
  lint:
    name: Code Quality & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check .

  # 2. Automated Testing & Security Scan
  test:
    name: Unit Tests & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          # Install minimal testing requirements
          pip install pydantic python-dotenv chromadb pandas openpyxl python-docx pypdf olefile

      - name: Run Test Suite
        env:
          APP_ENV: testing
          GEMINI_API_KEY: "mock_test_key_for_ci_pipeline_only"
        run: |
          pytest tests/ -v

  # 3. Docker Container Build Verification
  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: rag-vibe:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
